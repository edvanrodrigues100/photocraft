name: Build PhotoCraft APK (Rust)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4
        
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Preparar Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-30" "build-tools;34.0.0" "build-tools;30.0.3"
          
      - name: Configurar Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          
      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          
      - name: Instalar empacotador (cargo-apk)
        run: cargo install cargo-apk
        
      - name: Compilar o APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: cargo apk build -p photocraft --lib --release
          
      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-APK
          path: '**/*.apk'
          
